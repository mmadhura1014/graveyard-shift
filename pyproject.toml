[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graveyard-shift"
version = "0.1.0"
description = "Graveyard Shift — find zombie AWS resources before they eat your budget"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.6",
    "click>=8.1",
    "jsonschema>=4.21",
]

[project.scripts]
graveyard = "scanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "moto[ec2,iam,cloudwatch,logs,elbv2]>=5.0",
    "ruff>=0.4",
    "hypothesis>=6.100",
    "freezegun>=1.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH"]
ignore = ["E501"]
